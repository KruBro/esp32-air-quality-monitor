[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; --- USB UPLOAD SETTINGS (Fallback) ---
; upload_port = COM5
; upload_speed = 921600

; --- OTA SETTINGS (Enabled with Static IP) ---
upload_protocol = espota
; ; ; ✨ FIXED: Set to your router's reserved IP address
upload_port = 192.168.1.2 
upload_flags =
    --port=3232
    ; ✨ Make sure this password matches your C++ code
    --auth=baguvix 

; --- LIBRARIES (Unchanged) ---
lib_deps = 
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BME680 Library@^2.0.5
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.10
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/me-no-dev/AsyncTCP.git#master
    https://github.com/me-no-dev/ESPAsyncWebServer.git#master

; --- BUILD FLAGS (Unchanged) ---
; These flags correctly set the OTA password and use DHCP
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DASYNCWEBSERVER_REGEX=1
    -DARDUINOJSON_ENABLE_PROGMEM=1